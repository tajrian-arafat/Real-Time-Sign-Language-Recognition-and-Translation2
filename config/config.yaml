  normalization:
    origin: shoulder_midpoint
    scale: shoulder_width
  selected_landmark_count: 130
  holistic_index_documentation: Pose uses MediaPipe pose indices 0-32 at start of
    543-vector; face local indices offset +33; left hand +501; right hand +522.
model:
  architecture: conv1d_transformer
  conv1d_kernel: 3
  conv1d_layers: 2
  conv_channels: 256
  d_model: 256
  nhead: 4
  num_encoder_layers: 4
  dim_feedforward: 512
  dropout: 0.1
training:
  batch_size: 128
  batch_size_low_memory: 32
  max_epochs: 60
  early_stopping_patience: 8
  optimizer: AdamW
  weight_decay: 0.01
  label_smoothing: 0.1
  base_lr: 0.0003
  base_lr_batch_size: 128
  lr_warmup_ratio: 0.05
  lr_schedule: cosine
  num_workers: 3
  mixed_precision_when_cuda: true
  resume_on_oom:
    reduce_batch: true
    log_adjustment: true
augmentation:
  horizontal_mirror: true
  temporal_speed_jitter_ratio: 0.15
  coordinate_jitter_sigma: 0.01
inference:
  confidence_threshold: 0.6
  temporal_ema_windows: 3
  debounce_cooldown_ms: 800
  sliding_window_seconds_min: 1.0
  sliding_window_seconds_max: 1.5
  sliding_window_overlap: 0.5
  onnx_runtime_providers:
  - CPUExecutionProvider
sentence:
  duplicate_suppression: true
  low_confidence_ui: uncertain
translation:
  model_id: csebuetnlp/banglat5_nmt_en_bn
  tokenizer_use_fast: false
  normalizer_repo: git+https://github.com/csebuetnlp/normalizer
backend:
  host: 0.0.0.0
  port: 8000
  websocket_path: /ws/recognize
frontend:
  dev_port: 5173
  vite_proxy_backend: http://127.0.0.1:8000
mediapipe:
  tasks_api: true
  browser_package: '@mediapipe/tasks-vision'
  python_landmarker: HolisticLandmarker
hardware:
  device: cpu
  prefer_cuda: true
